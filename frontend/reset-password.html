<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miss Qassie | Reset Password</title>

<link rel="stylesheet" href="reset-password.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background-overlay"></div>

<div class="reset-card">

    <div class="logo-section">

        <img
            src="images/logo.png"
            alt="Miss Quassie Logo"
            class="logo"
        >

        <h1>MISS QASSIE</h1>

        <p>Administrator Password Reset</p>

    </div>

    <div id="resetMessage"></div>

    <form id="resetForm">

        <label>New Password</label>

        <div class="password-box">

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
            >

            <span
                class="togglePassword"
                id="toggleNewPassword"
            >
                👁
            </span>

        </div>

        <div class="strength">

            <div id="strengthBar"></div>

        </div>

        <small id="strengthText">
            Password Strength
        </small>

        <div class="requirements">

            <p id="lengthRule">✖ At least 8 characters</p>

            <p id="upperRule">✖ One uppercase letter</p>

            <p id="lowerRule">✖ One lowercase letter</p>

            <p id="numberRule">✖ One number</p>

            <p id="specialRule">✖ One special character</p>

        </div>

        <label>Confirm Password</label>

        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

            <span
                class="togglePassword"
                id="toggleConfirmPassword"
            >
                👁
            </span>

        </div>

        <small id="matchMessage"></small>

        <button
            id="savePasswordBtn"
            type="submit"
            disabled
        >
            🔐 Save Password
        </button>

    </form>

    <a
        href="admin-login.html"
        class="back-link"
    >
        ← Back to Login
    </a>

</div>

<script src="reset-password.js"></script>

</body>

</html>
